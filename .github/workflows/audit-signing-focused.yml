name: Focused signing acceptance (temporary audit)
on:
  push:
    branches: ['audit/sonar-remaining-issues']
    paths: ['.github/workflows/audit-signing-focused.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0e6dd0986940c688fd38513d2d8631eeead75a8a
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install acceptance dependencies
        run: python -m pip install -r requirements.txt "pypdf>=5,<7"
      - name: Run all signing regression modules independently
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: |
          $failures = @()
          foreach ($file in @('test_v1698_signing_storage.py','test_v1699_signing_import.py','test_v16100_image_editor.py','test_v16101_report_signing.py','test_v16102_signing_privacy.py','test_v16105_signing_workflow.py','test_stage_f_acceptance.py')) {
            Write-Host "=== Signing regression: $file ==="
            python -m scripts.run_ui_tests --pattern $file --timeout 90
            if ($LASTEXITCODE -ne 0) { $failures += $file }
          }
          if ($failures.Count -ne 0) { throw "Failed: $($failures -join ', ')" }
