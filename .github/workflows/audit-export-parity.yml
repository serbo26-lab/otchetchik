name: Historical export parity (temporary audit)

on:
  push:
    branches: ['audit/sonar-remaining-issues']
    paths:
      - 'scripts/audit_export_parity.py'
      - '.github/workflows/audit-export-parity.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 275fb3c245c5a4c4bc81253db97f94d023ac8a36
          path: historical
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ad501c1c2cb6ab7f5e75e05ab642ae2898ea06b3
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only export inspection libraries
        run: python -m pip install "openpyxl>=3.1" "python-docx>=1.1" "reportlab>=4.2" "pypdf>=5,<7"
      - name: Compare declarations and all three export formats
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/audit_export_parity.py inventory historical candidate
          if ($LASTEXITCODE -ne 0) { throw 'Inventory failed' }
          python scripts/audit_export_parity.py snapshot historical "$env:RUNNER_TEMP/before.json"
          if ($LASTEXITCODE -ne 0) { throw 'Baseline snapshot failed' }
          python scripts/audit_export_parity.py snapshot candidate "$env:RUNNER_TEMP/after.json"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate snapshot failed' }
          python scripts/audit_export_parity.py compare "$env:RUNNER_TEMP/before.json" "$env:RUNNER_TEMP/after.json"
          if ($LASTEXITCODE -ne 0) { throw 'Export content differs' }
