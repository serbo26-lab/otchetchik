name: Build Windows EXE

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish single EXE
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed.' }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }

      - name: Check Python syntax
        shell: pwsh
        run: |
          python -m compileall -q main.py src
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed.' }

      - name: UI and navigation tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'UI tests failed.' }

      - name: Build standalone Windows EXE
        shell: pwsh
        run: |
          $python = (Get-Command python -CommandType Application | Select-Object -First 1).Source
          $pythonDirectory = Split-Path -Parent $python
          # Prevent unrelated software in PATH from supplying incompatible Qt DLLs.
          $env:PATH = "$pythonDirectory;$pythonDirectory\Scripts;$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          & $python -m PyInstaller --noconfirm --clean --onefile --windowed --name Otchetnost_UK_728 main.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed.' }
          if (-not (Test-Path 'dist/Otchetnost_UK_728.exe' -PathType Leaf)) {
            throw 'Standalone executable is missing.'
          }
          if (Test-Path 'dist/Otchetnost_UK_728/_internal') {
            throw 'Found a multi-file distribution instead of a standalone EXE.'
          }

      - name: Smoke-test executable and portable data storage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'dist/Otchetnost_UK_728.exe').Path
          $testFolder = Join-Path $env:RUNNER_TEMP 'otchetchik-standalone-test'
          New-Item -ItemType Directory -Force -Path $testFolder | Out-Null
          $testExe = Join-Path $testFolder 'Otchetnost_UK_728.exe'
          Copy-Item $exe $testExe -Force
          $env:QT_QPA_PLATFORM = 'offscreen'
          $process = Start-Process -FilePath $testExe -WorkingDirectory $testFolder -PassThru
          try {
            $database = Join-Path $testFolder 'data/reporting_728.db'
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw "EXE quit unexpectedly (exit code: $($process.ExitCode))." }
              if (Test-Path $database -PathType Leaf) {
                $ready = $true
                break
              }
            }
            if (-not $ready) { throw 'Program did not initialize its portable database within 30 seconds.' }
            Write-Host 'Smoke test passed: standalone EXE started and data folder was created beside the EXE.'
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Publish single EXE to Dev Build
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'dist/Otchetnost_UK_728.exe'
          if (-not (Test-Path $exe -PathType Leaf)) { throw 'Standalone EXE is missing.' }

          $version = (Get-Content 'VERSION' -Raw -Encoding utf8).Trim()
          $notes = @'
          **В РАЗРАБОТКЕ, НА ТЕКУЩЕЙ СТАДИИ РАБОТАЕТ ПОСРЕДСТВЕННО, НЕ ИМЕЕТ СВЯЗИ С ОБЩЕЙ БД ИЗ ДРУГИХ ПО И СИНХРОНИЗАЦИИ ГИС ЖКХ!**

          Тестовая сборка программы «Отчетность УК» для Windows.

          **Установка:** скачайте один файл `Otchetnost_UK_728.exe` в отдельную папку и запустите его. Python и дополнительные файлы не нужны.

          **Данные:** при первом запуске рядом с программой автоматически создается папка `data`. При обновлении заменяйте только EXE и сохраняйте папку `data`.

          История изменений: [CHANGELOG.md](https://github.com/serbo26-lab/otchetchik/blob/main/CHANGELOG.md).
          '@
          $notes = "**Версия: $version**" + [Environment]::NewLine + [Environment]::NewLine + $notes
          $notesFile = Join-Path $env:RUNNER_TEMP 'otchetchik-dev-notes.md'
          [System.IO.File]::WriteAllText($notesFile, $notes, [System.Text.UTF8Encoding]::new($false))

          gh release view dev-build --repo $env:GH_REPO --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload dev-build $exe --repo $env:GH_REPO --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Cannot upload standalone EXE.' }

            # Previous builds were distributed as archives; remove these obsolete assets.
            $oldAssets = gh release view dev-build --repo $env:GH_REPO --json assets --jq '.assets[].name'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot list release assets.' }
            foreach ($asset in $oldAssets) {
              if ($asset -ne 'Otchetnost_UK_728.exe') {
                gh release delete-asset dev-build $asset --repo $env:GH_REPO --yes
                if ($LASTEXITCODE -ne 0) { throw "Cannot remove obsolete release asset: $asset" }
              }
            }
            gh release edit dev-build --repo $env:GH_REPO --title 'Dev Build' --notes-file $notesFile --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Cannot update Dev Build release.' }
            gh api --method PATCH "repos/$env:GH_REPO/git/refs/tags/dev-build" -f "sha=$env:GITHUB_SHA" -F "force=true" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Cannot update the dev-build tag.' }
          } else {
            gh release create dev-build $exe --repo $env:GH_REPO --title 'Dev Build' --notes-file $notesFile --prerelease --latest=false --target "$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create Dev Build release.' }
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "Standalone EXE published: https://github.com/$env:GH_REPO/releases/tag/dev-build" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "EXE SHA256: $hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
