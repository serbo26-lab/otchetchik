name: Read public Sonar issues (temporary audit)
on:
  push:
    branches: ['audit/sonar-remaining-issues']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read full project issues and candidate PR
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          def read(path, **params):
              url = "https://sonarcloud.io/api/" + path + "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(url, headers={"Accept": "application/json"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          project = "serbo26-lab_otchetchik"
          for target, extra in [("main", {}), ("PR 99", {"pullRequest": "99"})]:
              print("Audit target:", target)
              page = 1
              while True:
                  data = read("issues/search", componentKeys=project, resolved="false", ps=100, p=page, **extra)
                  total = data.get("total", data.get("paging", {}).get("total", 0))
                  print("Total:", total, "Page:", page)
                  for issue in data.get("issues", []):
                      print(json.dumps({key: issue.get(key) for key in
                          ("key", "rule", "component", "line", "message", "severity", "status")}, ensure_ascii=False))
                  if page * 100 >= total:
                      break
                  page += 1
          PY
