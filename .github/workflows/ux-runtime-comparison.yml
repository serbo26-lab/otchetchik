name: UX viewport and focus inventory (diagnostic only)
on:
  push:
    branches: [audit/ux-viewport-v1680]
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [reporter, assistant]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        if: matrix.app == 'assistant'
        with:
          repository: serbo26-lab/gis-jkh-assistant
          ref: b8e03159dc88f25444a51cd7cf53f6786b8885a3
          path: assistant-reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reporter dependencies
        if: matrix.app == 'reporter'
        run: python -m pip install -r requirements.txt
      - name: Install assistant dependencies
        if: matrix.app == 'assistant'
        run: python -m pip install -e ./assistant-reference
      - name: Inventory reporter
        if: matrix.app == 'reporter'
        run: python scripts/audit_ux_runtime.py reporter . "$env:RUNNER_TEMP/ux-audit"
      - name: Inventory assistant
        if: matrix.app == 'assistant'
        run: python scripts/audit_ux_runtime.py assistant assistant-reference "$env:RUNNER_TEMP/ux-audit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-${{ matrix.app }}
          path: ${{ runner.temp }}/ux-audit/
          retention-days: 14
          if-no-files-found: warn
